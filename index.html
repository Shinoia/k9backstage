<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>K9 · Ranking TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Página para OBS / TV vertical: 1080 x 1920, fundo preto, só o ranking. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
body{color:#fff;font-family:"Barlow Condensed","Arial Narrow","Roboto Condensed","DejaVu Sans Condensed",sans-serif;-webkit-font-smoothing:antialiased}

.stage{position:absolute;top:0;left:0;width:1080px;height:1920px;background:#000;overflow:hidden;transform-origin:0 0}

/* imagem lateral (direita), escurecida e fundida no preto */
.car{position:absolute;top:0;right:0;width:520px;height:1920px}
.car img{width:100%;height:100%;object-fit:cover;object-position:center;filter:brightness(.62) contrast(1.08) saturate(.85);display:block}
.car::after{content:"";position:absolute;inset:0;background:
  linear-gradient(90deg,#000 0%,#000 30%,rgba(0,0,0,.6) 52%,rgba(0,0,0,.15) 78%,rgba(0,0,0,.3) 100%),
  linear-gradient(180deg,#000 0%,transparent 18%,transparent 78%,#000 100%)}

.content{position:absolute;top:0;left:0;width:1080px;height:1920px;padding:110px 0 0 72px;z-index:1}

.kicker{font:600 26px/1 "Barlow Condensed","Arial Narrow","DejaVu Sans Condensed",sans-serif;letter-spacing:.32em;text-transform:uppercase;color:rgba(255,255,255,.6)}
h1{font:italic 800 132px/.86 "Barlow Condensed","Arial Narrow","DejaVu Sans Condensed",sans-serif;text-transform:uppercase;letter-spacing:-.01em;margin:22px 0 0}
.meta{font:600 30px/1.2 "Barlow Condensed","Arial Narrow","DejaVu Sans Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.72);margin-top:26px}
.meta i{font-style:normal;color:rgba(255,255,255,.3);margin:0 12px}
.rule{width:120px;height:4px;background:#fff;margin:44px 0 30px}

/* lista */
.head,.row{display:grid;grid-template-columns:78px 1fr 190px;align-items:center;width:740px}
.head{font:600 20px/1 "Barlow Condensed","Arial Narrow","DejaVu Sans Condensed",sans-serif;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.45);
  padding:0 0 16px;border-bottom:1px solid rgba(255,255,255,.18)}
.head .t,.row .t{text-align:right}
.row{height:64px;border-bottom:1px solid rgba(255,255,255,.08)}
.row .p{font:800 38px/1 "Barlow Condensed","Arial Narrow","DejaVu Sans Condensed",sans-serif}
.row .n{font:600 34px/1 "Barlow Condensed","Arial Narrow","DejaVu Sans Condensed",sans-serif;text-transform:uppercase;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:18px}
.row .t{font:700 30px/1 "JetBrains Mono",Consolas,"DejaVu Sans Mono",monospace;letter-spacing:-.01em}
.row.top .p,.row.top .n{font-weight:800}
.row.top{height:78px}
.row.top .p{font-size:50px}
.row.top .n{font-size:42px}
.row.top .t{font-size:34px}

.foot{position:absolute;left:72px;bottom:64px;font:500 20px/1 "JetBrains Mono",Consolas,"DejaVu Sans Mono",monospace;color:rgba(255,255,255,.4);letter-spacing:.04em}
.msg{font:600 32px/1.3 "Barlow Condensed","Arial Narrow","DejaVu Sans Condensed",sans-serif;color:rgba(255,255,255,.6);padding:40px 0}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="car"><img src="gt3rs.jpg" alt="" onerror="this.parentNode.style.display='none'"></div>

  <div class="content">
    <div class="kicker">K9 Campeonato</div>
    <h1>Classificação</h1>
    <div class="meta">Assetto Corsa<i>/</i>Interlagos<i>/</i>Porsche 911 GT3 RS</div>
    <div class="rule"></div>

    <div class="head"><span>Pos</span><span>Piloto</span><span class="t">Tempo</span></div>
    <div id="rows"><div class="msg">Carregando classificação…</div></div>
  </div>

  <div class="foot" id="foot"></div>
</div>

<script>
/* ========================= CONFIGURAÇÃO ========================= */
// Mesmo link CSV da aba RANKING usado na página inicial
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSpmePeuXEvjsDGJIwRZljAUhs8EyC03CZw8nJcBYSrj_L-4JcEw2iCS1TX0TM-fZiclvLVzjMf-kgo/pub?gid=497839822&single=true&output=csv";
// Quantos pilotos aparecem na tela (20 cabe com folga em 1920)
const TOP_N = 20;
// Atualizar a cada X segundos
const REFRESH_SECONDS = 60;
/* ================================================================ */

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// Encaixa o palco de 1080x1920 na janela (no OBS com 1080x1920 fica em tamanho real)
function fit(){
  const k = Math.min(innerWidth/1080, innerHeight/1920);
  const st = $("#stage");
  st.style.transform = `scale(${k})`;
  st.style.left = ((innerWidth - 1080*k)/2) + "px";
  st.style.top  = ((innerHeight - 1920*k)/2) + "px";
}
addEventListener("resize", fit); fit();

function parseCSV(text){
  const out=[]; let row=[], f="", q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=ch; }
    else if(ch==='"') q=true;
    else if(ch===','){ row.push(f); f=""; }
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(f); out.push(row); row=[]; f=""; }
    else f+=ch;
  }
  if(f!==""||row.length){ row.push(f); out.push(row); }
  return out;
}
function toMs(t){
  const p = String(t).trim().split(/[:.,]/).map(Number);
  if(p.length<3 || p.some(isNaN)) return NaN;
  const [m,s,ms]=p.slice(-3);
  return (m*60+s)*1000+ms;
}
function fmt(ms){
  const m=Math.floor(ms/60000), s=Math.floor(ms%60000/1000), r=ms%1000;
  return `${m}:${String(s).padStart(2,"0")}.${String(r).padStart(3,"0")}`;
}
function fromSheet(rows){
  const start = rows.findIndex(r => r.some(c => /^\s*NOME\s*$/i.test(c)));
  const h = rows[start] || [];
  const iN = h.findIndex(c=>/^\s*NOME\s*$/i.test(c)), iT = h.findIndex(c=>/^\s*TEMPO/i.test(c));
  const N = iN<0?3:iN, T = iT<0?4:iT;
  return rows.slice(start+1)
    .map(r => ({nome:(r[N]||"").trim(), ms:toMs(r[T]||"")}))
    .filter(d => d.nome && !isNaN(d.ms))
    .sort((a,b)=>a.ms-b.ms);
}

function render(data){
  $("#rows").innerHTML = data.length ? data.slice(0,TOP_N).map((d,i)=>`
    <div class="row${i<3?" top":""}">
      <span class="p">${i+1}</span>
      <span class="n">${esc(d.nome)}</span>
      <span class="t">${fmt(d.ms)}</span>
    </div>`).join("") : `<div class="msg">Nenhum tempo registrado ainda.</div>`;
}

let last = null;
async function load(){
  try{
    const res = await fetch(CSV_URL, {cache:"no-store"});
    if(!res.ok) throw new Error(res.status);
    const txt = await res.text();
    if(/<html/i.test(txt)) throw new Error("login");
    render(fromSheet(parseCSV(txt)));
    last = new Date();
    $("#foot").textContent = "Atualizado às " + last.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  }catch(e){
    // mantém a última lista na tela; só avisa no rodapé
    $("#foot").textContent = last ? "Sem conexão. Última atualização às " + last.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}) : "Não foi possível carregar a planilha";
    if(!last) $("#rows").innerHTML = `<div class="msg">Aguardando a planilha…</div>`;
  }
}
load();
setInterval(load, REFRESH_SECONDS*1000);
</script>
</body>
</html>
