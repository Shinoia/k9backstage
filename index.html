<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campeonato Assetto Corsa - Leaderboard</title>
  <style>
    :root {
      --bg-color: #0f1115;
      --card-bg: #1a1d24;
      --accent-color: #ff3e3e;
      --text-main: #f0f2f5;
      --text-muted: #8c93a0;
      --border-color: #2a2e39;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      line-height: 1.6;
    }

    .container { max-width: 1100px; margin: 0 auto; }
    
    header {
      text-align: center;
      margin-bottom: 30px;
      padding: 20px 0;
      border-bottom: 2px solid var(--accent-color);
    }
    header h1 { font-size: 2.2rem; text-transform: uppercase; letter-spacing: 1px; }
    header p { color: var(--text-muted); font-size: 1rem; }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 30px;
    }
    @media (min-width: 850px) {
      .grid { grid-template-columns: 1fr 1fr; }
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      border: 1px solid var(--border-color);
    }
    .card h2 {
      font-size: 1.3rem;
      margin-bottom: 15px;
      color: var(--accent-color);
      text-transform: uppercase;
    }

    /* Tabela de Classificação */
    .table-wrapper { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.95rem;
    }
    th {
      background-color: rgba(255, 62, 62, 0.1);
      color: var(--accent-color);
      text-transform: uppercase;
      font-size: 0.85rem;
    }
    .pos-cell { font-weight: bold; font-size: 1.1rem; }
