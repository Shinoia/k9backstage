<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K9 Campeonato - Assetto Corsa</title>
  <style>
    :root {
      --bg-color: #0f1115;
      --card-bg: #1a1d24;
      --accent-color: #ff3e3e;
      --text-main: #f0f2f5;
      --text-muted: #8c93a0;
      --border-color: #2a2e39;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      line-height: 1.6;
    }

    .container { max-width: 1100px; margin: 0 auto; }
    
    header {
      text-align: center;
      margin-bottom: 30px;
      padding: 20px 0;
      border-bottom: 2px solid var(--accent-color);
    }
    header h1 { font-size: 2.2rem; text-transform: uppercase; letter-spacing: 1px; }
    header p { color: var(--text-muted); font-size: 1rem; }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 30px;
    }
    @media (min-width: 850px) {
      .grid { grid-template-columns: 1fr 1fr; }
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      border: 1px solid var(--border-color);
    }
    .card h2 {
      font-size: 1.3rem;
      margin-bottom: 15px;
      color: var(--accent-color);
      text-transform: uppercase;
    }

    /* Tabela de Classificação */
    .table-wrapper { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.95rem;
    }
    th {
      background-color: rgba(255, 62, 62, 0.1);
      color: var(--accent-color);
      text-transform: uppercase;
      font-size: 0.85rem;
    }
    .pos-cell { font-weight: bold; font-size: 1.1rem; }
    .time-cell { font-family: monospace; font-size: 1rem; font-weight: bold; color: #40c463; }

    /* Estilo do Formulário */
    iframe {
      width: 100%;
      height: 650px;
      border: none;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>K9 Campeonato - Assetto Corsa</h1>
      <p>Classificação Geral e Inscrições de Pilotos</p>
    </header>

    <div class="grid">
      <!-- Seção da Classificação -->
      <section class="card">
        <h2>Leaderboard (Tempos)</h2>
        <div class="table-wrapper">
          <table id="leaderboard">
            <thead>
              <tr>
                <th>Pos.</th>
                <th>Piloto</th>
                <th>Tempo</th>
              </tr>
            </thead>
            <tbody>
              <tr><td colspan="3" style="text-align:center;">Carregando ranking...</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- Seção do Formulário de Inscrição -->
      <section class="card">
        <h2>Inscrição de Piloto</h2>
        <!-- SUBSTITUA O ATRIBUTO SRC PELO EMBED DO SEU GOOGLE FORMS -->
        <iframe src="https://docs.google.com/forms/d/e/SEU_ID_DO_FORMULARIO/viewform?embedded=true">Carregando…</iframe>
      </section>
    </div>
  </div>

  <script>
    // Link CSV configurado direto da aba RANKING da sua planilha
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSpmePeuXEvjsDGJIwRZljAUhs8EyC03CZw8nJcBYSrj_L-4JcEw2iCS1TX0TM-fZiclvLVzjMf-kgo/pub?gid=497839822&single=true&output=csv';

    async function fetchLeaderboard() {
      try {
        const response = await fetch(SHEET_CSV_URL);
        const data = await response.text();
        
        const rows = data.split('\n').map(row => row.split(','));
        const tbody = document.querySelector('#leaderboard tbody');
        tbody.innerHTML = '';

        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          
          if (row.length >= 4 && row[3] && row[3].replace(/"/g, '').trim() !== '') {
            const pos = row[1] ? row[1].replace(/"/g, '').trim() : `${i}º`;
            const nome = row[3].replace(/"/g, '').trim();
            const tempo = row[4] ? row[4].replace(/"/g, '').trim() : '--:--:---';

            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td class="pos-cell">${pos}</td>
              <td>${nome}</td>
              <td class="time-cell">${tempo}</td>
            `;
            tbody.appendChild(tr);
          }
        }

        if (tbody.children.length === 0) {
          tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">Nenhum piloto classificado ainda.</td></tr>';
        }

      } catch (error) {
        console.error('Erro ao buscar ranking:', error);
        document.querySelector('#leaderboard tbody').innerHTML = 
          '<tr><td colspan="3" style="text-align:center; color:#ff3e3e;">Erro ao carregar o ranking. Verifique o link do CSV.</td></tr>';
      }
    }

    fetchLeaderboard();
  </script>
</body>
</html>
