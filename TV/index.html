<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>K9 · Ranking TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Página para OBS / TV vertical: 1080 x 1920, fundo preto, só o ranking. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
body{color:#fff;font-family:"Barlow Condensed","Arial Narrow","DejaVu Sans Condensed",sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:"JetBrains Mono",Consolas,"DejaVu Sans Mono",monospace}

.stage{position:absolute;top:0;left:0;width:1080px;height:1920px;background:#000;overflow:hidden;transform-origin:0 0;
  display:flex;flex-direction:column}

/* topo */
.hdr{padding:72px 72px 0}
.logo{font-style:italic;font-weight:800;font-size:104px;line-height:.86;text-transform:uppercase;letter-spacing:-.01em}
.logo span{color:#e10600}
.meta{font-weight:600;font-size:28px;line-height:1.2;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.72);margin-top:24px}
.meta i{font-style:normal;color:rgba(255,255,255,.3);margin:0 12px}
.rule{width:120px;height:4px;background:#fff;margin:28px 0 22px}

/* lista: ocupa o espaço que sobrar entre o topo e o carro */
.list{flex:1;min-height:0;overflow:hidden;padding:0 72px}
.head,.row{display:grid;grid-template-columns:76px 110px 1fr 200px;align-items:center}
.head{font-weight:600;font-size:20px;line-height:1;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.45);
  padding:0 0 14px;border-bottom:1px solid rgba(255,255,255,.18)}
.head .t,.row .t{text-align:right}
.row{height:58px;border-bottom:1px solid rgba(255,255,255,.08)}
.row .p{font-weight:800;font-size:36px;line-height:1}
.row .c{font-weight:500;font-size:23px;line-height:1;color:rgba(255,255,255,.5)}
.row .n{font-weight:600;font-size:33px;line-height:1;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:18px}
.row .t{font-weight:700;font-size:29px;line-height:1;letter-spacing:-.01em}
.row.top{height:70px}
.row.top .p{font-size:48px}
.row.top .n{font-weight:800;font-size:40px}
.row.top .t{font-size:33px}
.msg{font-weight:600;font-size:32px;line-height:1.3;color:rgba(255,255,255,.6);padding:40px 0}

/* rodapé: carro + nome, ambos com 1050 px */
.bottom{width:1050px;margin:0 auto;padding:18px 0 18px}
.label{display:flex;justify-content:space-between;align-items:center;padding:0 4px;
  font-weight:600;font-size:20px;line-height:1;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.label .upd{font-weight:500;font-size:17px;letter-spacing:.04em;color:rgba(255,255,255,.38)}
.car{display:block;width:1050px;height:auto;margin-top:6px}
.vname{display:inline-block;font-style:italic;font-weight:800;line-height:.9;text-transform:uppercase;white-space:nowrap;margin-top:4px;font-size:150px}

/* menu discreto no rodapé */
.fmenu{display:flex;justify-content:center;flex-wrap:wrap;gap:0 26px;padding:0 0 22px;position:relative;z-index:1}
.fmenu a{color:rgba(255,255,255,.2);text-decoration:none;font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:15px;letter-spacing:.02em}
.fmenu a:hover{color:rgba(255,255,255,.55)}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="hdr">
    <div class="logo">K9 <span>Campeonato</span><br>Assetto Corsa</div>
    <div class="meta">Classificação<i>/</i>Interlagos<i>/</i>Melhor volta</div>
    <div class="rule"></div>
  </div>

  <div class="list" id="list">
    <div class="head"><span>Pos</span><span>Cód</span><span>Piloto</span><span class="t">Tempo</span></div>
    <div id="rows"><div class="msg">Carregando classificação…</div></div>
  </div>

  <div class="bottom">
    <div class="label"><span>Veículo da competição</span><span class="upd mono" id="foot"></span></div>
    <img class="car" src="gt3rs.png" alt="Porsche 911 GT3 RS" onerror="this.style.display='none'">
    <div class="vname" id="vname">Porsche 911 GT3 RS</div>
  </div>

  <nav class="fmenu"><a href="../">Início</a><a href="../#ranking">Classificação</a><a href="../#inscricao">Inscrição</a><a href="./">Ranking TV</a><a href="../podio/">Pódio</a></nav>
</div>

<script>
/* ========================= CONFIGURAÇÃO ========================= */
// Mesmo link CSV da aba RANKING usado na página inicial
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSpmePeuXEvjsDGJIwRZljAUhs8EyC03CZw8nJcBYSrj_L-4JcEw2iCS1TX0TM-fZiclvLVzjMf-kgo/pub?gid=497839822&single=true&output=csv";
// Quantos pilotos aparecem na tela (20 cabe com folga em 1920)
const TOP_N = 20;   // máximo; a página mostra só os que couberem
// Atualizar a cada X segundos
const REFRESH_SECONDS = 60;
/* ================================================================ */

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// Encaixa o palco de 1080x1920 na janela (no OBS com 1080x1920 fica em tamanho real)
function fit(){
  const k = Math.min(innerWidth/1080, innerHeight/1920);
  const st = $("#stage");
  st.style.transform = `scale(${k})`;
  st.style.left = ((innerWidth - 1080*k)/2) + "px";
  st.style.top  = ((innerHeight - 1920*k)/2) + "px";
}
addEventListener("resize", fit); fit();

function parseCSV(text){
  const out=[]; let row=[], f="", q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=ch; }
    else if(ch==='"') q=true;
    else if(ch===','){ row.push(f); f=""; }
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(f); out.push(row); row=[]; f=""; }
    else f+=ch;
  }
  if(f!==""||row.length){ row.push(f); out.push(row); }
  return out;
}
function toMs(t){
  const p = String(t).trim().split(/[:.,]/).map(Number);
  if(p.length<3 || p.some(isNaN)) return NaN;
  const [m,s,ms]=p.slice(-3);
  return (m*60+s)*1000+ms;
}
function fmt(ms){
  const m=Math.floor(ms/60000), s=Math.floor(ms%60000/1000), r=ms%1000;
  return `${m}:${String(s).padStart(2,"0")}.${String(r).padStart(3,"0")}`;
}
function fromSheet(rows){
  const start = rows.findIndex(r => r.some(c => /^\s*NOME\s*$/i.test(c)));
  const h = rows[start] || [];
  const iN = h.findIndex(c=>/^\s*NOME\s*$/i.test(c)), iT = h.findIndex(c=>/^\s*TEMPO/i.test(c)), iC = h.findIndex(c=>/^\s*COD/i.test(c));
  const N = iN<0?3:iN, T = iT<0?4:iT, C = iC<0?2:iC;
  return rows.slice(start+1)
    .map(r => ({cod:(r[C]||"").trim(), nome:(r[N]||"").trim(), ms:toMs(r[T]||"")}))
    .filter(d => d.nome && !isNaN(d.ms))
    .sort((a,b)=>a.ms-b.ms);
}

// nome do carro ocupando exatamente 1050 px
function fitName(){
  const el=$("#vname"); el.style.fontSize="150px";
  const w=el.scrollWidth; if(w) el.style.fontSize=(150*1050/w)+"px";
}
// remove as últimas linhas se não couberem acima do carro
function trimRows(){
  const list=$("#list"), rows=$("#rows");
  while(rows.children.length>1 && list.scrollHeight>list.clientHeight) rows.lastElementChild.remove();
}
if(document.fonts) document.fonts.ready.then(()=>{ fitName(); trimRows(); });
fitName();

function render(data){
  $("#rows").innerHTML = data.length ? data.slice(0,TOP_N).map((d,i)=>`
    <div class="row${i<3?" top":""}">
      <span class="p">${i+1}</span>
      <span class="c mono">${esc(d.cod)||"—"}</span>
      <span class="n">${esc(d.nome)}</span>
      <span class="t mono">${fmt(d.ms)}</span>
    </div>`).join("") : `<div class="msg">Nenhum tempo registrado ainda.</div>`;
  trimRows();
}

let last = null;
async function load(){
  try{
    const res = await fetch(CSV_URL, {cache:"no-store"});
    if(!res.ok) throw new Error(res.status);
    const txt = await res.text();
    if(/<html/i.test(txt)) throw new Error("login");
    render(fromSheet(parseCSV(txt)));
    last = new Date();
    $("#foot").textContent = "Atualizado às " + last.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  }catch(e){
    // mantém a última lista na tela; só avisa no rodapé
    $("#foot").textContent = last ? "Sem conexão. Última atualização às " + last.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}) : "Não foi possível carregar a planilha";
    if(!last) $("#rows").innerHTML = `<div class="msg">Aguardando a planilha…</div>`;
  }
}
load();
setInterval(load, REFRESH_SECONDS*1000);
</script>
</body>
</html>
